name: Atualizar dados SNIRH

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Lisbon"

permissions:
  contents: write

concurrency:
  group: refresh-snirh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Recolher dados oficiais
        run: npm run refresh:snirh

      - name: Validar snapshot
        run: npm run validate

      - name: Publicar apenas quando existem alterações válidas
        shell: bash
        run: |
          if git diff --quiet -- public/data/reservoir-status.json; then
            echo "Sem alterações a publicar."
            exit 0
          fi
          git config user.name "rios-vivos-data[bot]"
          git config user.email "rios-vivos-data[bot]@users.noreply.github.com"
          git add public/data/reservoir-status.json
          git commit -m "data: atualizar snapshot SNIRH"
          git push
